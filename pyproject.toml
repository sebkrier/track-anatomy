[project]
name = "track-anatomy"
dynamic = ["version"]
description = "Take a song apart (drums, bass, pads, leads, vocals, FX, structure, chords) and rebuild it in Ableton Live."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seb Krier" }]
keywords = ["music", "stem separation", "transcription", "ableton", "midi", "music production"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.11,<3.13"
# Exact tested pins live in requirements.txt; setup.sh installs torch for your hardware first.
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "audio-separator>=0.47,<0.48",
  "onnxruntime>=1.20",
  "beat-this>=1.1",
  "all-in-one-infer>=3.1",
  "lv-chordia>=1.1",
  "pretty-midi>=0.2.10",
  "mir-eval>=0.7",
  "resampy>=0.4",
  "scikit-learn>=1.3",
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "librosa>=0.10",
  "soundfile>=0.12",
  "mido>=1.3",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/sebkrier/track-anatomy"
Issues = "https://github.com/sebkrier/track-anatomy/issues"
Changelog = "https://github.com/sebkrier/track-anatomy/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]

[project.scripts]
track-anatomy = "track_anatomy.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["track_anatomy", "track_anatomy.pipeline"]

[tool.setuptools.package-data]
track_anatomy = ["web/*.html", "web/css/*", "web/js/*"]

[tool.setuptools.dynamic]
version = { attr = "track_anatomy.config.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["scratch", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
  "E731",   # small lambdas read fine here
  "E741",   # short names (l, O) are rare and deliberate
  "B008",   # FastAPI's File(...) / Body(...) defaults
  "B905",   # zip() without strict= is intended throughout
]
