<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Anatomy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231a1a19'/><rect x='6' y='8' width='4' height='16' rx='2' fill='%23d95926'/><rect x='12' y='5' width='4' height='22' rx='2' fill='%233987e5'/><rect x='18' y='11' width='4' height='10' rx='2' fill='%23199e70'/><rect x='24' y='9' width='4' height='14' rx='2' fill='%23c98500'/></svg>">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" title="Library">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="3" y="8" width="4" height="16" rx="2" fill="var(--g-bass)"/><rect x="10" y="4" width="4" height="24" rx="2" fill="var(--g-drums)"/><rect x="17" y="11" width="4" height="10" rx="2" fill="var(--g-harmony)"/><rect x="24" y="8" width="4" height="16" rx="2" fill="var(--g-melody)"/></svg>
      <span>Track Anatomy</span>
    </button>
    <div class="topbar-track" id="topTrack"></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="settingsBtn" title="Settings and about" aria-label="Settings and about">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <label class="btn btn-primary" for="fileInput">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 16V4m0 0-5 5m5-5 5 5M5 20h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Analyse a track
      </label>
      <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.flac,.aiff,.aif,.m4a,.ogg,.opus" hidden multiple>
    </div>
  </header>

  <main id="app"></main>

  <div class="drop-overlay" id="dropOverlay"><div>Drop audio to analyse</div></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="tooltip" id="tooltip"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
